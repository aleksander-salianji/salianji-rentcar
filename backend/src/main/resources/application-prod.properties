# Profili online (SPRING_PROFILES_ACTIVE=prod).
# Këtu nuk ka vlera rezervë: nëse mungon një variabël, serveri nuk niset,
# kështu që nuk publikohet kurrë me fjalëkalimin ose çelësin e punës lokale.

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Tirane
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
