# Bookers Car Albania — konfigurimi i backend-it
# Çdo vlerë mund të ndryshohet me variabël mjedisi (p.sh. DB_PASSWORD).
# Vlerat pas ":" janë për punë lokale me XAMPP. Online përdoret profili "prod"
# (application-prod.properties), i cili i kërkon vlerat sekrete nga serveri.

server.port=${PORT:8080}

# Cilësimet e kompjuterit tënd (fjalëkalimi i MySQL etj.) — skedar që nuk shkon në GitHub
spring.config.import=optional:classpath:application-local.properties
app.name=Bookers Car Albania

# --- Databaza MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:salianji_rentcar}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Tirane
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Tirane
spring.jackson.time-zone=Europe/Tirane
spring.jackson.serialization.write-dates-as-timestamps=false

# --- JWT (hyrja) ---
# Çelës VETËM për punë lokale. Online vendoset JWT_SECRET te serveri.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHkta2V5LWJvb2tlcnMtY2FyLWFsYmFuaWEtbG9jYWwtZGV2ZWxvcG1lbnQtMTIzNDU2}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# --- Llogaria e adminit (krijohet herën e parë) ---
app.admin.email=${ADMIN_EMAIL:admin@salianjirent.al}
app.admin.password=${ADMIN_PASSWORD:Admin123}

# --- Faqet që lejohen të thërrasin API-n (CORS), të ndara me presje ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# --- Fotot e ngarkuara ---
app.upload.dir=${UPLOAD_DIR:uploads}

# --- Email (opsional) ---
# Për të dërguar email, vendos te serveri: SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD. Pa to, njoftimet me email anashkalohen.
