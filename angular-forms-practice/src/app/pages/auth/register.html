<div class="auth-page">
  <div class="card auth-card wide">
    <h1>Krijo llogari</h1>
    <p class="muted">Me llogari rezervon më shpejt dhe ndjek rezervimet e tua.</p>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="grid-2 mt">
        <label class="field">
          <span>Emri</span>
          <input type="text" formControlName="firstName" autocomplete="given-name"
                 [class.invalid]="isInvalid('firstName')">
          @if (isInvalid('firstName')) {
            <small class="error">
              @if (hasError('firstName', 'required')) { Shkruaj emrin. }
              @if (hasError('firstName', 'minlength')) { Të paktën 2 shkronja. }
              @if (hasError('firstName', 'forbiddenName')) { Emri nuk mund të përmbajë "test". }
            </small>
          }
        </label>

        <label class="field">
          <span>Mbiemri</span>
          <input type="text" formControlName="lastName" autocomplete="family-name"
                 [class.invalid]="isInvalid('lastName')">
          @if (isInvalid('lastName')) {
            <small class="error">
              @if (hasError('lastName', 'required')) { Shkruaj mbiemrin. }
              @if (hasError('lastName', 'minlength')) { Të paktën 2 shkronja. }
              @if (hasError('lastName', 'forbiddenName')) { Mbiemri nuk mund të përmbajë "test". }
            </small>
          }
        </label>

        <label class="field">
          <span>Email</span>
          <input type="email" formControlName="email" autocomplete="email"
                 [class.invalid]="isInvalid('email')">
          @if (form.controls.email.pending) {
            <small class="checking">Duke kontrolluar email-in...</small>
          }
          @if (isInvalid('email')) {
            <small class="error">
              @if (hasError('email', 'required')) { Shkruaj email-in. }
              @if (hasError('email', 'email')) { Email nuk është i vlefshëm. }
              @if (hasError('email', 'emailTaken')) { Ky email është tashmë i regjistruar. <a routerLink="/hyr">Hyr</a> }
            </small>
          }
        </label>

        <label class="field">
          <span>Telefoni</span>
          <input type="tel" formControlName="phone" placeholder="06XXXXXXXX" autocomplete="tel"
                 [class.invalid]="isInvalid('phone')">
          @if (isInvalid('phone')) {
            <small class="error">Formati: 067/068/069 + 7 shifra.</small>
          }
        </label>

        <label class="field">
          <span>Fjalëkalimi</span>
          <input type="password" formControlName="password" autocomplete="new-password"
                 [class.invalid]="isInvalid('password')">
          @if (isInvalid('password')) {
            <small class="error">Të paktën 8 karaktere, me shkronja dhe shifra.</small>
          } @else {
            <small class="hint">Të paktën 8 karaktere, me shkronja dhe shifra.</small>
          }
        </label>

        <label class="field">
          <span>Konfirmo fjalëkalimin</span>
          <input type="password" formControlName="confirmPassword" autocomplete="new-password"
                 [class.invalid]="isInvalid('confirmPassword') || showMismatch()">
          @if (showMismatch()) {
            <small class="error">Fjalëkalimet nuk përputhen.</small>
          } @else if (isInvalid('confirmPassword')) {
            <small class="error">Konfirmo fjalëkalimin.</small>
          }
        </label>
      </div>

      <label class="check mt">
        <input type="checkbox" formControlName="acceptTerms">
        <span>Pranoj kushtet e përdorimit dhe politikën e privatësisë.</span>
      </label>
      @if (isInvalid('acceptTerms')) {
        <small class="error">Duhet të pranosh kushtet.</small>
      }

      <button type="submit" class="btn btn-primary btn-block btn-lg mt"
              [disabled]="loading()">
        @if (loading()) { Duke krijuar llogarinë... }
        @else if (form.pending) { Duke kontrolluar... }
        @else { Krijo llogarinë }
      </button>
    </form>

    <p class="auth-switch">
      Ke llogari? <a routerLink="/hyr" [queryParams]="kthehu() ? { kthehu: kthehu() } : {}">Hyr</a>
    </p>
  </div>
</div>
